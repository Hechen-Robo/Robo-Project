name: VDA5050 FMS

on:
  push:
    paths:
      - "robotics/VDA5050_FMS/**"
      - ".github/workflows/vda5050-fms.yml"
  pull_request:
    paths:
      - "robotics/VDA5050_FMS/**"
      - ".github/workflows/vda5050-fms.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robotics/VDA5050_FMS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robotics/VDA5050_FMS/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q src tests
