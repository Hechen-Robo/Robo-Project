[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vda5050-fms"
version = "0.1.0"
description = "A VDA 5050 fleet management system project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0,<2",
    "paho-mqtt>=2.1,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jsonschema>=4.23,<5",
]

[project.scripts]
vda5050-fms = "vda5050_fms.__main__:main"  

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
vda5050_fms = [
    "hmi/static/*.html",
    "hmi/static/*.css",
    "hmi/static/*.js",
    "lif/schemas/*.schema",
    "lif/schemas/LICENSE.LIF",
    "python-multipart>=0.0.20,<1",
]
