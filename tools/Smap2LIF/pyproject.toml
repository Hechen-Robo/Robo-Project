[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smap2lif"
version = "0.1.0"
description = "Convert SEER native maps to LIF 1.0.0."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.scripts]
smap2lif = "smap2lif.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smap2lif = [
    "schemas/*.schema",
    "schemas/*.txt",
]