[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smap2lif"
version = "0.1.0"
description = "Convert native 2D source maps to validated LIF 1.0.0 files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.scripts]
smap2lif = "smap2lif.cli:main"

[project.gui-scripts]
smap2lif-gui = "smap2lif.gui:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.11,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smap2lif = [
    "schemas/*.schema",
    "schemas/*.LIF",
]
